    description = Lysosomal co-localization assay

# environment -----------------------------------------------------------------

[environment]
    name = Aghajani
    type = tf

# conda dependencies ----------------------------------------------------------

[conda-core]
    python = 3.10
    numpy = 1.24*
    numba = 
    scipy =
    pandas =
    scikit-image = 
    opencv = 4.8.0
    scikit-learn =
    joblib =
    matplotlib-base =
    pip =
[conda-spec]
    nd2 =
    napari =
    pyqt =
    spyder =
[conda_tf-gpu]
    cudatoolkit = 11.2
    cudnn = 8.1
[conda_tf-nogpu]

# pip dependencies ------------------------------------------------------------

[pip-core]
[pip-spec]
[pip_tf-gpu]
    albumentations =
    segmentation-models = 
    tensorflow-gpu = =2.10
    h5py = =3.11.0
    numpy> =1.24,<1.25
[pip_tf-nogpu]
    albumentations =
    segmentation-models = 
    tensorflow = =2.10
    h5py = =3.11.0
    numpy> =1.24,<1.25
